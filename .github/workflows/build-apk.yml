name: Build ESoft Admin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    name: Build ESoft Admin APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Verify ESoft Admin project
        run: |
          test -f settings.gradle
          test -f build.gradle
          test -f app/build.gradle
          test -f app/google-services.json
          echo "ESoft Admin Android project verified."

      - name: Build ESoft Admin debug APK
        run: gradle assembleDebug

      - name: Upload ESoft Admin APK
        uses: actions/upload-artifact@v4
        with:
          name: ESoft-Admin-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
